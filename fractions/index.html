<style>
/* Layout: one calm column for the child (question card + journey trail), a scan-first dashboard for the teacher, one huge QR for the projector. */
:root {
  --bg: #EDF3F1; --surface: #FFFFFF; --sunk: #E2ECE9; --ink: #15313A; --muted: #587076; --line: #C5D7D3;
  --shade: #F5A623; --pre: #2F9C92; --accent: #1C6F6A; --accent-ink: #FFFFFF; --focus: #E2683C;
  --ok: #23845A; --ok-bg: #DDF1E6; --warn: #A86D00; --warn-bg: #FBEBCB; --bad: #B83B33; --bad-bg: #F8DEDA;
  --tA: #E8961A; --tB: #2F9C92; --tC: #D9604C; --tD: #6F64C8;
  --font-display: 'Fredoka', 'Rubik', 'Segoe UI', Arial, sans-serif;
  --font-body: 'Rubik', 'Segoe UI', Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1C1E; --surface: #162A2D; --sunk: #102224; --ink: #E3EEEC; --muted: #9AB1AF; --line: #2B4447;
  --shade: #F6B444; --pre: #46B9AE; --accent: #46B9AE; --accent-ink: #062120; --focus: #FF9A6C;
  --ok: #5CC58C; --ok-bg: #173B2B; --warn: #E8B54E; --warn-bg: #3A2E14; --bad: #F07D73; --bad-bg: #42201D;
  --tA: #F2A93A; --tB: #46B9AE; --tC: #EE7D6A; --tD: #958BEA; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1C1E; --surface: #162A2D; --sunk: #102224; --ink: #E3EEEC; --muted: #9AB1AF; --line: #2B4447;
  --shade: #F6B444; --pre: #46B9AE; --accent: #46B9AE; --accent-ink: #062120; --focus: #FF9A6C;
  --ok: #5CC58C; --ok-bg: #173B2B; --warn: #E8B54E; --warn-bg: #3A2E14; --bad: #F07D73; --bad-bg: #42201D;
  --tA: #F2A93A; --tB: #46B9AE; --tC: #EE7D6A; --tD: #958BEA; color-scheme: dark; }

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
#app { min-height: 100vh; padding-inline: 16px; padding-block: 12px 40px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
a { color: var(--accent); }
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.wide { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }

/* preview bar */
.pbar { max-width: 1120px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: var(--r); font-size: 14px; color: var(--muted); }
.pbar strong { color: var(--ink); }
.tabs { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--line); background: var(--surface); padding: 10px 18px; border-radius: 12px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { font-family: var(--font-display); font-size: 1.25rem; padding: 14px 24px; min-height: 58px; border-radius: 16px; width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; }
label { font-weight: 500; }
.field { display: flex; flex-direction: column; gap: 6px; }
input[type=text], input[type=password], input[inputmode], select { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 50px; font-size: 1.1rem; width: 100%; }
input:focus { border-color: var(--accent); outline: none; }
.err { color: var(--bad); font-weight: 500; margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }

/* ===== child ===== */
.brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding-top: 14px; }
.brand h1 { font-size: 2.3rem; }
.brand p { margin: 0; color: var(--muted); }
.logo { width: 120px; height: 72px; }
.logo .pt { stroke-width: 2.5; }
.startform { display: flex; flex-direction: column; gap: 14px; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; background: var(--sunk); white-space: nowrap; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.chip.tA { color: var(--tA); } .chip.tB { color: var(--tB); } .chip.tC { color: var(--tC); } .chip.tD { color: var(--tD); }
.chip.tA span:last-child, .chip.tB span:last-child, .chip.tC span:last-child, .chip.tD span:last-child { color: var(--ink); }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
.trail { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.trail .seg { display: flex; gap: 4px; }

.trail .seg.tA i.d { background: var(--tA); border-color: var(--tA); }
.trail .seg.tB i.d { background: var(--tB); border-color: var(--tB); }
.trail .seg.tC i.d { background: var(--tC); border-color: var(--tC); }
.trail .seg.tD i.d { background: var(--tD); border-color: var(--tD); }
.trail i.cur { border-color: var(--ink); transform: scale(1.25); }
.qcard { display: flex; flex-direction: column; gap: 18px; padding: 20px 18px; }
.qtext { display: flex; align-items: flex-start; gap: 10px; }
.qtext h2 { font-family: var(--font-body); font-weight: 500; font-size: 1.3rem; line-height: 1.6; flex: 1; min-width: 0; }
.say { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--sunk); display: grid; place-items: center; cursor: pointer; }
.say svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.say.on { border-color: var(--accent); background: var(--accent); }
.say.on svg { stroke: var(--accent-ink); }
.hint { margin: -8px 0 0; color: var(--muted); font-size: 15px; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; font-family: var(--font-display); font-weight: 600; font-size: 1.12em; margin: 0 .15em; font-variant-numeric: tabular-nums; }
.fr > span:first-child { border-bottom: 2.5px solid currentColor; padding: 0 .2em .05em; }
.fr > span:last-child { padding: .05em .2em 0; }
.fr .box { display: inline-block; width: .9em; height: 1em; border: 2px dashed currentColor; border-radius: 4px; vertical-align: -0.1em; }
.visual { display: flex; justify-content: center; }
.visual svg, .opt svg { max-width: 100%; height: auto; }
.shape { width: 100%; max-width: 320px; }
.shape.circ { max-width: 200px; }
.wholes { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.wholes .shape { max-width: 150px; }
.items { width: 100%; max-width: 340px; }
.pt { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.pt.on { fill: var(--shade); }
.pt.pre { fill: var(--pre); }
.it.pt { stroke-width: 2.5; }
.tap .pt:not(.pre) { cursor: pointer; }
.tap .pt:not(.pre):hover { fill: var(--sunk); }
.tap .pt.on:not(.pre):hover { fill: var(--shade); }
.tap .pt:focus-visible { outline: none; stroke: var(--focus); stroke-width: 4; }
.tally { text-align: center; color: var(--muted); font-size: 15px; margin: -6px 0 0; font-variant-numeric: tabular-nums; }
.nline { width: 100%; max-width: 520px; touch-action: none; user-select: none; }
.nline .ax { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.nline .tk { stroke: var(--ink); stroke-width: 2; }
.nline .tk.mj { stroke-width: 3; }
.nline .lb { fill: var(--ink); font: 600 19px var(--font-display); }
.nline .pnt { fill: var(--tC); stroke: var(--surface); stroke-width: 2; }
.nline .pl { fill: var(--ink); font: 600 18px var(--font-display); }
.nline .mk path, .nline .mk circle { fill: var(--shade); stroke: var(--ink); stroke-width: 2; }
.nline .mk line { stroke: var(--ink); stroke-width: 2; }
.nline.tap { cursor: pointer; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 64px; padding: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.3rem; font-weight: 500; text-align: center; }
.opt.svgopt { min-height: 90px; }
.opt.svgopt svg { width: 100%; max-width: 200px; }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); background: var(--sunk); }
.opts.one { grid-template-columns: 1fr; }
.fin { display: flex; justify-content: center; }
.fin .fstack { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
.fin .bar { width: 92px; height: 4px; background: var(--ink); border-radius: 2px; }
.numin { width: 92px !important; text-align: center; font-family: var(--font-display); font-size: 1.6rem !important; font-weight: 600; padding: 8px !important; }
.status-line { text-align: center; font-size: 14px; color: var(--muted); min-height: 1.4em; margin: 0; }
.status-line.warn { color: var(--warn); }
.endcard { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px 20px; }
.endcard h2 { font-size: 1.8rem; }
.endcard p { margin: 0; max-width: 34ch; }

/* ===== teacher ===== */
.thead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.thead h1 { font-size: 1.9rem; }
.thead .sub { color: var(--muted); margin: 2px 0 0; }
.controls { display: flex; flex-direction: column; gap: 14px; }
.ctlrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ctlrow select { width: auto; min-width: 0; max-width: 100%; min-height: 44px; font-size: 15px; padding: 8px 12px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 500; font-size: 15px; }
.pill::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.pill.open { background: var(--ok-bg); color: var(--ok); }
.pill.closed { background: var(--sunk); color: var(--muted); }
.linkbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.linkbox code { background: var(--sunk); padding: 6px 10px; border-radius: 8px; direction: ltr; overflow-wrap: anywhere; min-width: 0; flex: 1; font-size: 13px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px; background: var(--sunk); border-radius: 12px; }
.inline-form input { flex: 1; min-width: 180px; min-height: 44px; font-size: 15px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tcard .tn { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; }
.tcard .tn .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.tcard .pct { font-family: var(--font-display); font-size: 2.2rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.tcard .meter { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.tcard .meter > span { display: block; height: 100%; border-radius: 4px; }
td .tier { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
.tcard .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec > h2 { font-size: 1.35rem; }
.sec > .lead { margin: -6px 0 0; color: var(--muted); font-size: 15px; }
.summary-line { color: var(--muted); font-variant-numeric: tabular-nums; }
.misl { display: flex; flex-direction: column; gap: 10px; }
.mis { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.mis > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }
.mis > summary::-webkit-details-marker { display: none; }
.mis > summary .nm { font-weight: 700; min-width: 0; }
.mis > summary .ct { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mis > summary .bar { grid-column: 2 / 4; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.mis > summary .bar span { display: block; height: 100%; background: var(--bad); border-radius: 3px; }
.more > summary { list-style: none; width: max-content; }
.more > summary::-webkit-details-marker { display: none; }
.mis[open] > summary { border-bottom: 1px solid var(--line); }
.misbody { padding: 14px 16px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 22px; }
.misbody h4 { margin: 0 0 4px; font-size: 13px; letter-spacing: .02em; color: var(--muted); font-weight: 500; }
.misbody p { margin: 0; }
.misbody .full { grid-column: 1 / -1; }
.names { display: flex; flex-wrap: wrap; gap: 6px; }
.names span { background: var(--sunk); border-radius: 999px; padding: 3px 10px; font-size: 14px; }
.names span b { font-weight: 500; color: var(--muted); margin-inline-start: 4px; font-variant-numeric: tabular-nums; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-top: 5px solid var(--gc, var(--line)); }
.group h3 { font-size: 1.1rem; }
.group p { margin: 0; font-size: 14px; color: var(--muted); }
.tblwrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 15px; }
th, td { text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 13px; color: var(--muted); font-weight: 500; background: var(--sunk); position: sticky; top: 0; }
tr.srow { cursor: pointer; }
tr.srow:hover td { background: var(--sunk); }
td.nm { font-weight: 500; white-space: nowrap; }
.sc { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border-radius: 8px; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.sc small { font-weight: 400; font-size: 12px; opacity: .85; }
.sc.g { background: var(--ok-bg); color: var(--ok); }
.sc.m { background: var(--warn-bg); color: var(--warn); }
.sc.b { background: var(--bad-bg); color: var(--bad); }
.sc.n { background: var(--sunk); color: var(--muted); }
.st { font-size: 13px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.st.done { background: var(--ok-bg); color: var(--ok); }
.st.active { background: var(--warn-bg); color: var(--warn); }
.detail td { background: var(--bg); padding: 14px; }
.ansl { display: flex; flex-direction: column; gap: 6px; }
.ans { display: grid; grid-template-columns: 34px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.ans .mark { font-family: var(--font-display); font-weight: 600; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; }
.ans .mark.c { background: var(--ok-bg); color: var(--ok); }
.ans .mark.w { background: var(--bad-bg); color: var(--bad); }
.ans .meta { color: var(--muted); font-size: 13px; }
.ans .mtag { color: var(--bad); font-weight: 500; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.toast { position: fixed; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 15px; z-index: 9; }

/* ===== projector ===== */
.proj { max-width: 1000px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; padding-top: 3vh; }
.proj h1 { font-size: clamp(2.4rem, 6vw, 4.4rem); }
.proj .steps { font-size: clamp(1.1rem, 2.2vw, 1.6rem); margin: 18px 0 0; padding-inline-start: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.qrbox { background: #FFFFFF; padding: 18px; border-radius: 20px; border: 1px solid var(--line); }
.qrbox #qr { width: min(40vw, 380px); aspect-ratio: 1; }
.qrbox #qr img, .qrbox #qr canvas { width: 100% !important; height: auto !important; display: block; }
.pcount { display: flex; gap: 28px; margin-top: 26px; flex-wrap: wrap; }
.pcount div { display: flex; flex-direction: column; }
.pcount b { font-family: var(--font-display); font-size: clamp(2.6rem, 6vw, 4.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.pcount span { color: var(--muted); font-size: 1.1rem; }
.purl { direction: ltr; text-align: center; font-size: 13px; color: #33484C; margin: 10px 0 0; max-width: 380px; overflow-wrap: anywhere; }

@media (max-width: 760px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .misbody { grid-template-columns: 1fr; }
  .proj { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .proj .steps { text-align: start; }
  .qrbox #qr { width: min(70vw, 320px); }
  .pcount { justify-content: center; }
}
@media (max-width: 380px) { .opts { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) {
  .qcard { animation: rise .28s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<script>
/* ===== מסע השברים – מנוע שאלות, אבחון והמלצות ===== */
var FR = (function () {
  'use strict';

  /* ---------- כלים ---------- */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a || 1; }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function F(n, d) { return '[[' + n + '/' + d + ']]'; }
  function eqv(n1, d1, n2, d2) { return n1 * d2 === n2 * d1; }
  function range(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }

  /* ---------- מילים בעברית לשברים (להקראה) ---------- */
  var DEN_WORDS = {

  /* ---------- סיווג תשובה ---------- */
  function near(a, b, tol) { return Math.abs(a - b) <= (tol || 1e-6); }
  function classify(q, ans) {
    var r = { c: false, m: '', a: '' };
    if (q.kind === 'mc') {
      var o = q.options[ans];
      r.c = !!(o && o.correct);
      r.m = r.c ? '' : (o && o.mis) || q.topic + '_OTHER';
      r.a = o ? (q.svgOptions ? o.desc : toPlain(o.label)) : '';
    } else if (q.kind === 'shade') {
      var cnt = ans | 0;
      r.c = cnt === q.target;
      r.m = r.c ? '' : (q.misByCount && q.misByCount[cnt]) || q.topic + '_OTHER';
      r.a = 'סימן ' + cnt;
    } else if (q.kind === 'line') {
      var v = +ans, tol = q.snap ? 1e-6 : q.tol;
      r.c = near(v, q.target, tol);
      if (!r.c) {
        r.m = q.topic + '_OTHER';
        for (var i = 0; i < (q.misPoints || []).length; i++) {
          var mp = q.misPoints[i];
          if (mp.v >= 0 && mp.v <= q.max && !near(mp.v, q.target, 1e-6) && near(v, mp.v, q.snap ? 1e-6 : q.tol)) { r.m = mp.mis; break; }
        }
      }
      r.a = q.seg ? toPlain(nearestFrac(v, q.seg)) : '≈ ' + v.toFixed(2);
    } else if (q.kind === 'frac') {
      var n = +ans[0], d = +ans[1];
      r.a = n + '/' + d;
      r.c = d > 0 && eqv(n, d, q.target[0], q.target[1]);
      if (!r.c) {
        r.m = q.topic + '_OTHER';
        for (var j = 0; j < q.mis.length; j++) { if (d > 0 && eqv(n, d, q.mis[j].n, q.mis[j].d)) { r.m = q.mis[j].mis; break; } }
      }
    } else if (q.kind === 'int') {
      var x = +ans;
      r.a = String(x);
      r.c = x === q.target;
      if (!r.c) {
        r.m = q.topic + '_OTHER';
        for (var k = 0; k < q.mis.length; k++) if (q.mis[k].v === x) { r.m = q.mis[k].mis; break; }
      }
    }
    return r;
  }
  function nearestFrac(v, seg) { var k = Math.round(v * seg); var g = gcd(k, seg); return k === 0 ? '0' : F(k, seg); }

  var S = { attemptId: null, name: '', state: null, q: null, answer: null, pending: [], busy: false };

  function logoSVG() {
    return '<svg class="logo" viewBox="0 0 120 72" aria-hidden="true">' +
      '<rect class="pt on" x="4" y="14" width="28" height="44" rx="3"/><rect class="pt on" x="32" y="14" width="28" height="44" rx="3"/>' +
      '<rect class="pt on" x="60" y="14" width="28" height="44" rx="3"/><rect class="pt" x="88" y="14" width="28" height="44" rx="3"/></svg>';
  }

  function studentWelcome(msg) {
    var saved = lsGet('fj_name') || {};
    var closed = BOOT && !BOOT.open;
    view.innerHTML =
      '<div class="wrap">' +
      '<header class="brand">' + logoSVG() + '<h1>מסע השברים</h1><p>20 שאלות על שברים. עונים בקצב שלכם, ואין צורך למהר.</p></header>' +
      (closed ? '<div class="card endcard"><h2>הבדיקה סגורה כרגע</h2><p>חכו שהמורה יפתח את הבדיקה ונסו שוב.</p><button class="btn primary" id="retry">לנסות שוב</button></div>' :
      '<form class="card startform" id="fstart" novalidate>' +
      '<div class="field"><label for="first">שם פרטי</label><input type="text" id="first" autocomplete="given-name" maxlength="20" value="' + esc(saved.first || '') + '"></div>' +
      '<div class="field"><label for="last">האות הראשונה של שם המשפחה</label><input type="text" id="last" maxlength="1" value="' + esc(saved.last || '') + '"></div>' +
      '<p class="err" id="ferr"' + (msg ? '' : ' hidden') + '>' + esc(msg || '') + '</p>' +
      '<button class="btn primary big" id="go" type="submit">יוצאים למסע</button>' +
      '</form>') +
      '</div>';
    if (closed) { document.getElementById('retry').onclick = boot; return; }
    document.getElementById('fstart').onsubmit = function (e) {
      e.preventDefault();
      var first = document.getElementById('first').value.trim(), last = document.getElementById('last').value.trim();
      var er = document.getElementById('ferr');
      if (!first) { er.textContent = 'כתבו את השם הפרטי שלכם.'; er.hidden = false; return; }
      if (!last) { er.textContent = 'כתבו את האות הראשונה של שם המשפחה.'; er.hidden = false; return; }
      lsSet('fj_name', { first: first, last: last });
      var btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'רגע…';
      studentBegin(first, last, false);
    };
  }

  function studentBegin(first, last, forceNew) {
    api('studentStart', first, last, forceNew).then(function (r) {
      if (r.closed) { BOOT.open = false; return studentWelcome(); }
      var local = lsGet('fj_att');
      var state = r.state;
      var pending = [];
      if (local && local.attemptId === r.attemptId && local.state && (!state || local.state.n > state.n)) { state = local.state; pending = local.pending || []; }
      S.attemptId = r.attemptId; S.name = r.name; S.state = state || FR.newState(); S.pending = pending;
      if (r.resumed && S.state.n > 0 && !forceNew) return studentResume(first, last);
      persist(); flush(); nextQ();
    }, function (e) { studentWelcome(errMsg(e)); });
  }

  function studentResume(first, last) {
    view.innerHTML = '<div class="wrap"><div class="card endcard">' +
      '<h2>שלום ' + esc(S.name) + '!</h2>' +
      '<p>כבר התחלתם את המסע. עניתם על ' + S.state.n + ' מתוך ' + FR.total + ' שאלות.</p>' +
      '<button class="btn primary big" id="cont">ממשיכים מאיפה שעצרנו</button>' +
      '<button class="btn" id="fresh">זה לא אני – מתחילים בדיקה חדשה</button>' +
      '</div></div>';
    document.getElementById('cont').onclick = function () { persist(); flush(); nextQ(); };
    document.getElementById('fresh').onclick = function () { lsDel('fj_att'); studentBegin(first, last, true); };
  }

  function persist() { lsSet('fj_att', { attemptId: S.attemptId, state: S.state, pending: S.pending }); }

  function flush() {
    if (S.busy || !S.pending.length) return Promise.resolve();
    S.busy = true;
    var item = S.pending[0];
    return api('studentSave', S.attemptId, item.rec, item.state, item.done).then(function (r) {
      S.busy = false;
      if (r && r.closed) { setStatus('הבדיקה נסגרה. התשובות שלכם שמורות.', true); BOOT.open = false; if (item.done) return; return showClosedMid(); }
      S.pending.shift(); persist(); setStatus('');
      return flush();
    }, function () {
      S.busy = false;
      setStatus('אין חיבור כרגע. התשובות נשמרות בטלפון ויישלחו כשהחיבור יחזור.', true);
      setTimeout(flush, 5000);
    });
  }
  function setStatus(t, warn) { var el = document.getElementById('sline'); if (el) { el.textContent = t; el.className = 'status-line' + (warn ? ' warn' : ''); } }

  function showClosedMid() {
    view.innerHTML = '<div class="wrap"><div class="card endcard"><h2>הבדיקה נסגרה</h2><p>התשובות שלכם שמורות. כשהמורה יפתח שוב, תוכלו להמשיך מאותה נקודה.</p><button class="btn primary" id="back">חזרה למסך הכניסה</button></div></div>';
    document.getElementById('back').onclick = boot;
  }

  function trailHTML(s) {
    var h = '<div class="trail" aria-hidden="true">';
    FR.TOPICS.forEach(function (t, ti) {
      h += '<span class="seg ' + TOPIC_CLS[t] + '">';
      for (var i = 0; i < FR.PER_TOPIC; i++) {
        var idx = ti * FR.PER_TOPIC + i;
        h += '<i class="' + (idx < s.n ? 'd' : '') + (idx === s.n ? ' cur' : '') + '"></i>';
      }
      h += '</span>';
    });
    return h + '</div>';
  }

  function nextQ() {
    stopSpeech();
    if (FR.done(S.state)) return studentDone();
    S.q = FR.nextQuestion(S.state); S.answer = null;
    renderQuestion();
  }

  function renderQuestion() {
    var q = S.q, t = q.topic, info = FR.TOPIC_INFO[t];
    var h = '<div class="wrap">' +
      '<div class="topline"><span class="chip ' + TOPIC_CLS[t] + '"><span class="dot"></span><span>' + esc(info.name) + '</span></span>' +
      '<span class="count">שאלה ' + (S.state.n + 1) + ' מתוך ' + FR.total + '</span></div>' +
      trailHTML(S.state) +
      '<section class="card qcard" aria-live="polite">' +
      '<div class="qtext"><h2>' + FR.toHTML(q.text) + '</h2>' +
      (SPEECH ? '<button type="button" class="say" id="say" aria-label="הקראת השאלה">' + SPEAKER + '</button>' : '') + '</div>' +
      (q.hint ? '<p class="hint">' + esc(q.hint) + '</p>' : '');
    if (q.kind === 'line') h += '<div class="visual" id="vis">' + lineMarkup(q.max, q.seg) + '</div>';
    else if (q.visual) h += '<div class="visual' + (q.kind === 'shade' ? ' tap' : '') + '" id="vis">' + q.visual + '</div>';
    if (q.kind === 'shade') h += '<p class="tally" id="tally">עדיין לא צבעתם</p>';
    if (q.kind === 'mc') {
      h += '<div class="opts' + (q.options.length <= 2 && !q.svgOptions ? '' : '') + '" role="group" aria-label="אפשרויות">';
      q.options.forEach(function (o, i) {
        h += '<button type="button" class="opt' + (q.svgOptions ? ' svgopt' : '') + '" data-i="' + i + '" aria-pressed="false"' + (q.svgOptions ? ' aria-label="' + esc(o.desc) + '"' : '') + '>' + (q.svgOptions ? o.svg : FR.toHTML(o.label)) + '</button>';
      });
      h += '</div>';
    }
    if (q.kind === 'frac') {
      h += '<div class="fin"><div class="fstack" dir="ltr"><input id="fn" inputmode="numeric" pattern="[0-9]*" maxlength="3" class="numin" aria-label="מונה" autocomplete="off"><span class="bar"></span><input id="fd" inputmode="numeric" pattern="[0-9]*" maxlength="3" class="numin" aria-label="מכנה" autocomplete="off"></div></div>';
    }
    if (q.kind === 'int') {
      h += '<div class="fin"><input id="iv" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="numin" style="width:130px!important" aria-label="התשובה" autocomplete="off"></div>';
    }
    h += '<button type="button" class="btn primary big" id="next" disabled>' + (S.state.n + 1 === FR.total ? 'סיום המסע' : 'לשאלה הבאה') + '</button>' +
      '<p class="status-line" id="sline"></p></section></div>';
    view.innerHTML = h;
    window.scrollTo(0, 0);

    var nextBtn = document.getElementById('next');
    function ready(ok) { nextBtn.disabled = !ok; }
    var say = document.getElementById('say');
    if (say) say.onclick = function () { speak(speechFor(q), say); };

    if (q.kind === 'mc') {
      view.querySelectorAll('.opt').forEach(function (b) {
        b.onclick = function () {
          view.querySelectorAll('.opt').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true'); S.answer = +b.getAttribute('data-i'); ready(true);
        };
      });
    } else if (q.kind === 'shade') {
      bindShade(document.getElementById('vis'), ready, q);
    } else if (q.kind === 'line') {
      bindLine(document.querySelector('#vis svg'), q, ready);
    } else if (q.kind === 'frac') {
      var fn = document.getElementById('fn'), fd = document.getElementById('fd');
      var upd = function () {
        fn.value = fn.value.replace(/\D/g, ''); fd.value = fd.value.replace(/\D/g, '');
        var ok = fn.value !== '' && fd.value !== '' && +fd.value > 0;
        S.answer = ok ? [+fn.value, +fd.value] : null; ready(ok);
      };
      fn.oninput = fd.oninput = upd;
      fn.onkeydown = function (e) { if (e.key === 'Enter') fd.focus(); };
      fd.onkeydown = function (e) { if (e.key === 'Enter' && !nextBtn.disabled) nextBtn.click(); };
    } else if (q.kind === 'int') {
      var iv = document.getElementById('iv');
      iv.oninput = function () { iv.value = iv.value.replace(/\D/g, ''); S.answer = iv.value === '' ? null : +iv.value; ready(iv.value !== ''); };
      iv.onkeydown = function (e) { if (e.key === 'Enter' && !nextBtn.disabled) nextBtn.click(); };
    }
    nextBtn.onclick = submitAnswer;
    if (S.pending.length) setStatus('שולח תשובות קודמות…');
  }

  function speechFor(q) {
    var t = FR.toSpeech(q.text);
    if (q.hint) t += '. ' + q.hint;
    if (q.kind === 'mc' && !q.svgOptions) t += '. האפשרויות: ' + q.options.map(function (o) { return FR.toSpeech(o.label); }).join(', ');
    if (q.kind === 'mc' && q.svgOptions) t += '. בחרו את הצורה המתאימה.';
    if (q.kind === 'frac') t += '. כתבו מונה ומכנה.';
    return t;
  }

  function lineMarkup(max, seg) {
    var L = FR.LINE, unit = (L.x1 - L.x0) / max;
    var s = '<svg class="nline tap" viewBox="0 0 ' + L.W + ' ' + L.H + '" dir="ltr" tabindex="0" role="slider" aria-label="ישר מספרים – בחרו מקום" aria-valuemin="0" aria-valuemax="' + max + '">';
    s += '<rect x="0" y="0" width="' + L.W + '" height="' + L.H + '" fill="transparent"/>';
    s += '<line class="ax" x1="' + (L.x0 - 12) + '" y1="' + L.y + '" x2="' + (L.x1 + 12) + '" y2="' + L.y + '"/>';
    if (seg) for (var k = 0; k <= max * seg; k++) {
      var x = L.x0 + k * unit / seg, mj = k % seg === 0;
      s += '<line class="tk' + (mj ? ' mj' : '') + '" x1="' + x + '" y1="' + (L.y - (mj ? 14 : 9)) + '" x2="' + x + '" y2="' + (L.y + (mj ? 14 : 9)) + '"/>';
    }
    for (var u = 0; u <= max; u++) {
      var xu = L.x0 + u * unit;
      if (!seg) s += '<line class="tk mj" x1="' + xu + '" y1="' + (L.y - 14) + '" x2="' + xu + '" y2="' + (L.y + 14) + '"/>';
      s += '<text class="lb" x="' + xu + '" y="' + (L.y + 36) + '" text-anchor="middle">' + u + '</text>';
    }
    s += '<g class="mk" hidden="hidden"><path d="M0,-30 L-10,-46 L10,-46 Z"/><line x1="0" y1="-30" x2="0" y2="0"/><circle r="7"/></g>';
    return s + '</svg>';
  }

  function bindShade(box, ready, q) {
    var tally = document.getElementById('tally');
    var parts = box.querySelectorAll('.pt:not(.pre)');
    var noun = q.topic === 'D' ? ['סימנתם', 'עיגול אחד', 'עיגולים'] : ['צבעתם', 'חלק אחד', 'חלקים'];
    function update() {
      var c = box.querySelectorAll('.pt.on:not(.pre)').length;
      S.answer = c; ready(c > 0);
      tally.textContent = c === 0 ? (q.topic === 'D' ? 'עדיין לא סימנתם' : 'עדיין לא צבעתם') : noun[0] + ' ' + (c === 1 ? noun[1] : c + ' ' + noun[2]);
    }
    parts.forEach(function (p) {
      p.setAttribute('tabindex', '0'); p.setAttribute('role', 'button');
      var tog = function () { p.classList.toggle('on'); update(); };
      p.addEventListener('click', tog);
      p.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } });
    });
  }

  function bindLine(svg, q, ready) {
    var L = FR.LINE, mk = svg.querySelector('.mk'), drag = false, v = null;
    function place(val) {
      val = Math.max(0, Math.min(q.max, val));
      if (q.snap && q.seg) val = Math.round(val * q.seg) / q.seg;
      else val = Math.round(val * 100) / 100;
      v = val; S.answer = val;
      var x = L.x0 + val * (L.x1 - L.x0) / q.max;
      mk.setAttribute('transform', 'translate(' + x + ',' + L.y + ')');
      mk.removeAttribute('hidden');
      svg.setAttribute('aria-valuenow', String(val));
      ready(true);
    }
    function fromEvt(e) {
      var r = svg.getBoundingClientRect();
      var xvb = (e.clientX - r.left) / r.width * L.W;
      return (xvb - L.x0) / (L.x1 - L.x0) * q.max;
    }
    svg.addEventListener('pointerdown', function (e) { drag = true; try { svg.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } place(fromEvt(e)); e.preventDefault(); });
    svg.addEventListener('pointermove', function (e) { if (drag) place(fromEvt(e)); });
    svg.addEventListener('pointerup', function () { drag = false; });
    svg.addEventListener('pointercancel', function () { drag = false; });
    svg.addEventListener('keydown', function (e) {
      var step = q.snap && q.seg ? 1 / q.seg : 0.02;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { place((v == null ? 0 : v) + step); e.preventDefault(); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { place((v == null ? 0 : v) - step); e.preventDefault(); }
    });
  }

  function submitAnswer() {
    var q = S.q;
    if (S.answer == null) return;
    var res = FR.classify(q, S.answer);
    var rec = FR.record(q, res, S.state.n + 1);
    rec.mn = rec.m && FR.MIS[rec.m] ? FR.MIS[rec.m].name : '';
    FR.applyAnswer(S.state, q, res);
    var fin = FR.done(S.state);
    S.pending.push({ rec: rec, state: JSON.parse(JSON.stringify(S.state)), done: fin });
    persist();
    flush();
    nextQ();
  }

  function studentDone() {
    view.innerHTML = '<div class="wrap">' + trailHTML(S.state) +
      '<div class="card endcard">' + logoSVG().replace('class="pt" x="88"', 'class="pt on" x="88"') +
      '<h2>סיימתם את המסע!</h2><p>כל הכבוד ' + esc(S.name) + '. התשובות נשלחו למורה. אפשר לסגור את הדף.</p>' +
      '<p class="status-line" id="sline"></p></div></div>';
    if (S.pending.length) { setStatus('שולח את התשובות האחרונות…'); }
    (function waitSaved() { if (!S.pending.length) { setStatus('כל התשובות נשמרו.'); lsDel('fj_att'); return; } flush(); setTimeout(waitSaved, 700); })();
  }

  /* =====================================================
     מורה
     ===================================================== */
  var T = { code: null, data: null, scope: 'current', openDetails: {}, openRows: {}, poll: null, sig: '', showNew: false, exportLinks: null };

  function teacherStart() {
    var c = ssGet('fj_tcode');
    if (c) { T.code = c; return teacherLoad(true); }
    teacherLogin();
  }
  function teacherLogin(msg) {
    view.innerHTML = '<div class="wrap"><header class="brand">' + logoSVG() + '<h1>מסך מורה</h1><p>מסע השברים</p></header>' +
      '<form class="card startform" id="tlog" novalidate><div class="field"><label for="tcode">קוד מורה</label><input type="password" id="tcode" autocomplete="current-password" inputmode="numeric"></div>' +
      '<p class="err" id="terr"' + (msg ? '' : ' hidden') + '>' + esc(msg || '') + '</p><button class="btn primary big" type="submit">כניסה</button></form></div>';
    document.getElementById('tlog').onsubmit = function (e) {
      e.preventDefault();
      var code = document.getElementById('tcode').value.trim();
      api('teacherLogin', code).then(function () { T.code = code; ssSet('fj_tcode', code); teacherLoad(true); }, function (er) { teacherLogin(errMsg(er)); });
    };
  }
  function teacherLoad(first) {
    return api('teacherGet', T.code).then(function (d) {
      if (!d || !d.attempts) { toast('השרת החזיר תשובה ריקה. נסו לרענן.'); if (first) teacherLogin('לא הצלחנו לטעון את הנתונים. נסו שוב.'); return; }
      try {
      var sig = d.attempts.length + ':' + d.answers.length + ':' + d.open + ':' + d.current + ':' + d.sessions.length + ':' + d.attempts.map(function (a) { return a[5]; }).join('');
      T.data = d;
      if (first || sig !== T.sig) { T.sig = sig; renderTeacher(); }
      if (first) {
        clearInterval(T.poll);
        T.poll = setInterval(function () { if (!document.hidden && MODE === 'teacher') teacherLoad(false); }, 15000);
      }
      } catch (err) { toast('שגיאה בהצגת הנתונים: ' + errMsg(err)); if (first) teacherLogin('שגיאה בהצגת הנתונים: ' + errMsg(err)); }
    }, function (e) {
      var m = errMsg(e);
      if (/קוד/.test(m)) { try { sessionStorage.removeItem('fj_tcode'); } catch (x) { /* ignore */ } return teacherLogin(m); }
      toast('לא הצלחנו לרענן: ' + m);
    });
  }

  function attObjs(d) {
    return d.attempts.map(function (r) { return { id: r[0], name: r[1], key: r[2], sessionId: r[3], started: r[4], updated: r[5], status: r[6], answered: r[7] }; });
  }
  function ansObjs(d) {
    return d.answers.map(function (r) { return { id: r[0], n: +r[1], t: r[2], lv: +r[3], k: r[4], c: +r[5] ? 1 : 0, m: r[6], q: r[7], e: r[8], a: r[9], g: r[10], ts: r[11] }; });
  }
  function latestPerStudent(atts) {
    var by = {};
    atts.forEach(function (a) { if (!by[a.key] || a.started > by[a.key].started) by[a.key] = a; });
    return Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) { return a.name.localeCompare(b.name, 'he'); });
  }
  function fmtDate(iso) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' }) + ' ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); }
  function scCls(c, a) { if (!a) return 'n'; var p = c / a; return p >= 0.8 ? 'g' : p >= 0.6 ? 'm' : 'b'; }

  function currentView() {
    var d = T.data, atts = attObjs(d), ans = ansObjs(d);
    var scopeId = T.scope === 'current' ? d.current : T.scope;
    var inScope = scopeId === 'all' ? atts : atts.filter(function (a) { return a.sessionId === scopeId; });
    var chosen = latestPerStudent(inScope);
    var A = FR.analyze(chosen, ans);
    return { atts: atts, ans: ans, A: A, scopeId: scopeId, chosen: chosen };
  }

  function renderTeacher() {
    var d = T.data, cv = currentView(), A = cv.A;
    var sesLabel = function (s) { return (s.label || s.id) + (s.created ? ' · ' + fmtDate(s.created) : ''); };
    var studentsN = A.students.length, doneN = A.students.filter(function (s) { return s.status === 'done'; }).length;
    var projUrl = d.url ? d.url + '?page=projector' : '#projector';
    var h = '<div class="wide">';
    h += '<header class="thead"><div><h1>מסע השברים</h1><p class="sub">מסך מורה · ' + esc(d.sessionLabel || '') + '</p></div>' +
      '<span class="pill ' + (d.open ? 'open' : 'closed') + '">' + (d.open ? 'הבדיקה פתוחה לתלמידים' : 'הבדיקה סגורה') + '</span></header>';

    // controls
    h += '<section class="card controls">' +
      '<div class="ctlrow">' +
      '<button class="btn ' + (d.open ? '' : 'primary') + '" id="t-open">' + (d.open ? 'סגירת הבדיקה' : 'פתיחת הבדיקה') + '</button>' +
      '<button class="btn" id="t-new">סבב חדש</button>' +
      '<a class="btn" href="' + esc(projUrl) + '" target="_blank" rel="noopener" id="t-proj">מסך מקרן</a>' +
      '<button class="btn" id="t-exp">ייצוא לאקסל</button>' +
      (d.sheetUrl ? '<a class="btn" href="' + esc(d.sheetUrl) + '" target="_blank" rel="noopener">פתיחת הגיליון</a>' : '') +
      '<button class="btn" id="t-ref">רענון</button>' +
      '</div>' +
      (T.showNew ? '<form class="inline-form" id="t-newf"><label for="t-newl">שם הסבב</label><input type="text" id="t-newl" value="' + esc('סבב ' + new Date().toLocaleDateString('he-IL')) + '"><button class="btn primary" type="submit">פתיחת סבב חדש</button><button class="btn" type="button" id="t-newc">ביטול</button><span class="muted" style="flex-basis:100%;font-size:14px">סבב חדש מתחיל דף נקי. הסבבים הקודמים נשמרים בגיליון ובהיסטוריה.</span></form>' : '') +
      (T.exportLinks ? '<div class="inline-form">' + (T.exportLinks.preview ? '<span>בגרסה המותקנת נוצר כאן קובץ אקסל להורדה, וגיליון "סיכום" מתעדכן ב-Google Sheets.</span>' : '<span>גיליון הסיכום עודכן.</span><a class="btn primary" href="' + esc(T.exportLinks.xlsxUrl) + '" target="_blank" rel="noopener">הורדת קובץ אקסל</a><a class="btn" href="' + esc(T.exportLinks.sheetUrl) + '" target="_blank" rel="noopener">פתיחה ב-Google Sheets</a>') + '</div>' : '') +
      '<div class="ctlrow"><label for="t-scope" class="muted" style="font-weight:400">מציג:</label><select id="t-scope">' +
      '<option value="current"' + (T.scope === 'current' ? ' selected' : '') + '>הסבב הנוכחי</option>' +
      d.sessions.slice().reverse().filter(function (s) { return s.id !== d.current; }).map(function (s) { return '<option value="' + esc(s.id) + '"' + (T.scope === s.id ? ' selected' : '') + '>' + esc(sesLabel(s)) + '</option>'; }).join('') +
      '<option value="all"' + (T.scope === 'all' ? ' selected' : '') + '>כל הסבבים (הניסיון האחרון של כל ילד)</option></select>' +
      '<span class="summary-line">' + studentsN + ' תלמידים · ' + doneN + ' סיימו</span></div>' +
      (d.url ? '<div class="linkbox"><span class="muted">קישור לתלמידים:</span><code id="t-url">' + esc(d.url) + '</code><button class="btn sm" id="t-copy">העתקה</button></div>' : '') +
      '</section>';

    if (!studentsN) {
      h += '<div class="empty"><p><strong>עדיין אין תשובות בסבב הזה.</strong></p><p>פתחו את מסך המקרן, והתלמידים יסרקו את הברקוד. התוצאות יופיעו כאן תוך כמה שניות מכל תשובה.</p></div></div>';
      view.innerHTML = h; bindTeacher(); return;
    }

    // topic cards
    h += '<section class="kpis" aria-label="הצלחה לפי נושא">';
    FR.TOPICS.forEach(function (t) {
      var st = A.topicStats[t], pct = st.pct;
      var col = pct == null ? 'var(--line)' : pct >= 80 ? 'var(--ok)' : pct >= 60 ? 'var(--warn)' : 'var(--bad)';
      h += '<div class="tcard"><div class="tn"><span class="dot" style="background:' + TOPIC_VAR[t] + '"></span>' + esc(FR.TOPIC_INFO[t].name) + '</div>' +
        '<div class="pct">' + (pct == null ? '–' : pct + '%') + '</div>' +
        '<div class="meter"><span style="width:' + (pct || 0) + '%;background:' + col + '"></span></div>' +
        '<div class="meta">' + st.correct + ' נכונות מתוך ' + st.asked + (st.avgLevel ? ' · רמה ממוצעת ' + st.avgLevel.toFixed(1) + ' מתוך 3' : '') + '</div></div>';
    });
    h += '</section>';

    // misconceptions
    h += '<section class="sec"><h2>טעויות נפוצות ומה עושים איתן</h2><p class="lead">מסודר לפי מספר התלמידים שטעו כך. לחצו על טעות כדי לראות הסבר, פעילות ושאלת מעקב.</p>';
    if (!A.misList.length) h += '<div class="empty">לא נמצאו טעויות. מצוין!</div>';
    else {
      h += '<div class="misl">';
      A.misList.forEach(function (m, mi) {
        if (mi === 6) h += '<details class="more" id="mis-more"' + (T.openDetails['mis-more'] ? ' open' : '') + '><summary class="btn sm">עוד ' + (A.misList.length - 6) + ' טעויות פחות נפוצות</summary><div class="misl" style="margin-top:10px">';
        var info = FR.MIS[m.id] || { t: m.id.charAt(0), name: m.id, explain: '', activity: '', tools: '', follow: '' };
        var w = Math.round(100 * m.students.length / Math.max(1, studentsN));
        var did = 'mis-' + m.id;
        h += '<details class="mis" id="' + did + '"' + (T.openDetails[did] ? ' open' : '') + '><summary>' +
          '<span class="chip ' + TOPIC_CLS[info.t] + '"><span class="dot"></span><span>' + esc(FR.TOPIC_INFO[info.t].short) + '</span></span>' +
          '<span class="nm">' + esc(info.name) + '</span>' +
          '<span class="ct">' + m.students.length + ' תלמידים · ' + m.count + ' טעויות</span>' +
          '<span class="bar"><span style="width:' + w + '%"></span></span></summary>' +
          '<div class="misbody">' +
          '<div class="full"><h4>מה כנראה חושבים</h4><p>' + esc(info.explain) + '</p></div>' +
          '<div><h4>פעילות כיתתית קצרה</h4><p>' + esc(info.activity) + '</p></div>' +
          '<div><h4>אמצעי המחשה</h4><p>' + esc(info.tools) + '</p><h4 style="margin-top:12px">שאלת מעקב לשאול בעל פה</h4><p>' + FR.toHTML(info.follow) + '</p></div>' +
          '<div class="full"><h4>התלמידים</h4><div class="names">' + m.students.sort(function (a, b) { return b.count - a.count; }).map(function (s) { return '<span>' + esc(s.name) + (s.count > 1 ? '<b>×' + s.count + '</b>' : '') + '</span>'; }).join('') + '</div></div>' +
          '</div></details>';
      });
      if (A.misList.length > 6) h += '</div></details>';
      h += '</div>';
    }
    h += '</section>';

    // groups
    var G = A.groups, groupHTML = '';
    FR.TOPICS.forEach(function (t) {
      if (!G[t].length) return;
      var misCount = {};
      G[t].forEach(function (s) { s.mis.forEach(function (m) { if (FR.MIS[m] && FR.MIS[m].t === t) misCount[m] = (misCount[m] || 0) + 1; }); });
      var topMis = Object.keys(misCount).sort(function (a, b) { return misCount[b] - misCount[a]; }).slice(0, 2).map(function (m) { return FR.MIS[m].name; });
      groupHTML += '<div class="group" style="--gc:' + TOPIC_VAR[t] + '"><h3>חיזוק: ' + esc(FR.TOPIC_INFO[t].name) + '</h3>' +
        '<div class="names">' + G[t].map(function (s) { return '<span>' + esc(s.name) + '</span>'; }).join('') + '</div>' +
        (topMis.length ? '<p><strong>במוקד:</strong> ' + esc(topMis.join(' · ')) + '</p>' : '') +
        '<p>' + esc(FR.TOPIC_INFO[t].plan) + '</p></div>';
    });
    if (G.MIX.length) groupHTML += '<div class="group" style="--gc:var(--warn)"><h3>תרגול משולב</h3><div class="names">' + G.MIX.map(function (s) { return '<span>' + esc(s.name) + '</span>'; }).join('') + '</div><p>שולטים ברוב הנושאים אבל עוד לא ברמה הגבוהה. מתאים לדף תרגול שמשלב את ארבעת הנושאים ולעבודה בזוגות.</p></div>';
    if (G.ADV.length) groupHTML += '<div class="group" style="--gc:var(--ok)"><h3>מוכנים לאתגר</h3><div class="names">' + G.ADV.map(function (s) { return '<span>' + esc(s.name) + '</span>'; }).join('') + '</div><p>הגיעו לרמה 3 בכל הנושאים. אפשר להתקדם להשוואת שברים, שברים שקולים ובעיות מילוליות מורכבות.</p></div>';
    h += '<section class="sec"><h2>קבוצות עבודה</h2><p class="lead">כל ילד משויך לנושא החלש ביותר שלו (פחות מ-60% הצלחה או ירידה לרמה 1). ילדים שענו על פחות מ-4 שאלות עוד לא משויכים.</p>' +
      (groupHTML ? '<div class="groups">' + groupHTML + '</div>' : '<div class="empty">אין עדיין מספיק תשובות לחלוקה לקבוצות.</div>') + '</section>';

    // students table
    h += '<section class="sec"><h2>פירוט לכל תלמיד</h2><p class="lead">בכל נושא: תשובות נכונות מתוך השאלות, והרמה שבה הילד סיים (1 קלה – 3 קשה). בחלק מכמות מופיע גם טווח המספרים שקיבל, לפי ההצלחה שלו בשלושת הנושאים הקודמים. לחצו על שורה לפירוט התשובות.</p><div class="tblwrap"><table><thead><tr><th>שם</th><th>מצב</th>' +
      FR.TOPICS.map(function (t) { return '<th>' + esc(FR.TOPIC_INFO[t].short) + '</th>'; }).join('') + '<th>טעויות בולטות</th></tr></thead><tbody>';
    A.students.forEach(function (s) {
      var top = Object.keys(s.mis).filter(function (m) { return !/_OTHER$/.test(m); }).sort(function (a, b) { return s.mis[b] - s.mis[a]; }).slice(0, 2);
      var rid = 'row-' + s.id;
      h += '<tr class="srow" data-r="' + rid + '" tabindex="0" aria-expanded="' + (!!T.openRows[rid]) + '"><td class="nm">' + esc(s.name) + '</td><td><span class="st ' + (s.status === 'done' ? 'done' : 'active') + '">' + (s.status === 'done' ? 'סיים' : 'בעבודה · ' + s.total + '/' + FR.total) + '</span></td>' +
        FR.TOPICS.map(function (t) { var T2 = s.topics[t]; return '<td>' + (T2.asked ? '<span class="sc ' + scCls(T2.correct, T2.asked) + '">' + T2.correct + '/' + T2.asked + '<small>רמה ' + T2.level + '</small></span>' : '<span class="sc n">–</span>') + (t === 'D' && s.tier ? '<div class="tier">' + esc(FR.TIER_LABEL[s.tier]) + '</div>' : '') + '</td>'; }).join('') +
        '<td>' + (top.length ? top.map(function (m) { return esc(FR.MIS[m] ? FR.MIS[m].name : m); }).join('<br>') : '<span class="muted">–</span>') + '</td></tr>';
      if (T.openRows[rid]) h += detailRow(s, cv);
    });
    h += '</tbody></table></div></section>';
    h += '</div>';
    view.innerHTML = h;
    bindTeacher();
  }

  function detailRow(s, cv) {
    var hist = cv.atts.filter(function (a) { return a.key === (cv.chosen.filter(function (c) { return c.id === s.id; })[0] || {}).key; }).sort(function (a, b) { return a.started < b.started ? 1 : -1; });
    var ansBy = {}; cv.ans.forEach(function (a) { (ansBy[a.id] = ansBy[a.id] || []).push(a); });
    var h = '<tr class="detail"><td colspan="7"><div class="ansl">';
    if (!s.answers.length) h += '<p class="muted">עוד אין תשובות.</p>';
    s.answers.forEach(function (a) {
      var mn = a.m && FR.MIS[a.m] ? FR.MIS[a.m].name : '';
      h += '<div class="ans"><span class="mark ' + (a.c ? 'c' : 'w') + '">' + (a.c ? '✓' : '✗') + '</span><div>' +
        '<div class="meta">' + a.n + ' · ' + esc(FR.TOPIC_INFO[a.t] ? FR.TOPIC_INFO[a.t].short : a.t) + ' · רמה ' + a.lv + '</div>' +
        '<div>' + esc(a.q) + '</div>' +
        '<div><span class="muted">תשובה נכונה:</span> <bdi>' + esc(a.e) + '</bdi> · <span class="muted">ענה:</span> <bdi>' + esc(a.a) + '</bdi>' + (mn ? ' · <span class="mtag">' + esc(mn) + '</span>' : '') + '</div>' +
        '</div></div>';
    });
    if (hist.length > 1) {
      h += '<div class="meta" style="margin-top:6px"><strong>היסטוריה:</strong> ' + hist.map(function (a) {
        var l = ansBy[a.id] || [], c = l.filter(function (x) { return x.c; }).length;
        return esc(fmtDate(a.started)) + ' – ' + c + '/' + l.length;
      }).join(' · ') + '</div>';
    }
    return h + '</div></td></tr>';
  }

  function bindTeacher() {
    var d = T.data;
    var $ = function (id) { return document.getElementById(id); };
    if ($('t-open')) $('t-open').onclick = function () {
      this.disabled = true;
      api('teacherSetOpen', T.code, !d.open).then(function () { toast(d.open ? 'הבדיקה נסגרה' : 'הבדיקה נפתחה'); teacherLoad(false); }, function (e) { toast(errMsg(e)); });
    };
    if ($('t-new')) $('t-new').onclick = function () { T.showNew = true; renderTeacher(); var i = $('t-newl'); if (i) i.focus(); };
    if ($('t-newc')) $('t-newc').onclick = function () { T.showNew = false; renderTeacher(); };
    if ($('t-newf')) $('t-newf').onsubmit = function (e) {
      e.preventDefault();
      api('teacherNewSession', T.code, $('t-newl').value).then(function () { T.showNew = false; T.scope = 'current'; T.exportLinks = null; toast('נפתח סבב חדש'); teacherLoad(true); }, function (er) { toast(errMsg(er)); });
    };
    if ($('t-ref')) $('t-ref').onclick = function () { teacherLoad(true); toast('עודכן'); };
    if ($('t-copy')) $('t-copy').onclick = function () { copyText(d.url); };
    if ($('t-proj') && !LIVE) $('t-proj').onclick = function (e) { e.preventDefault(); MODE = 'projector'; renderPreviewBar(); route(); };
    if ($('t-scope')) $('t-scope').onchange = function () { T.scope = this.value; T.exportLinks = null; renderTeacher(); };
    if ($('t-exp')) $('t-exp').onclick = function () {
      var btn = this; btn.disabled = true; btn.textContent = 'מכין…';
      var cv = currentView(), rows = exportRows(cv);
      var title = 'מסע השברים – סיכום – ' + (T.scope === 'all' ? 'כל הסבבים' : (d.sessions.filter(function (s) { return s.id === cv.scopeId; })[0] || {}).label || '');
      api('teacherExport', T.code, title, rows).then(function (r) { T.exportLinks = r; renderTeacher(); }, function (e) { btn.disabled = false; btn.textContent = 'ייצוא לאקסל'; toast(errMsg(e)); });
    };
    view.querySelectorAll('details.mis, details.more').forEach(function (el) { el.addEventListener('toggle', function () { T.openDetails[el.id] = el.open; }); });
    view.querySelectorAll('tr.srow').forEach(function (tr) {
      var tog = function () { var r = tr.getAttribute('data-r'); T.openRows[r] = !T.openRows[r]; renderTeacher(); var n = view.querySelector('tr[data-r="' + r + '"]'); if (n) n.focus(); };
      tr.onclick = tog;
      tr.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } };
    });
  }

  function exportRows(cv) {
    var A = cv.A, rows = [];
    var head = ['שם', 'מצב', 'נכונות', 'שאלות'];
    FR.TOPICS.forEach(function (t) { head.push(FR.TOPIC_INFO[t].short + ' – נכונות', FR.TOPIC_INFO[t].short + ' – רמה'); });
    head.push('חלק מכמות – טווח מספרים', 'קבוצת עבודה', 'טעויות בולטות');
    rows.push(head);
    var groupOf = {};
    FR.TOPICS.forEach(function (t) { A.groups[t].forEach(function (s) { groupOf[s.id] = 'חיזוק: ' + FR.TOPIC_INFO[t].short; }); });
    A.groups.MIX.forEach(function (s) { groupOf[s.id] = 'תרגול משולב'; });
    A.groups.ADV.forEach(function (s) { groupOf[s.id] = 'מוכנים לאתגר'; });
    A.students.forEach(function (s) {
      var r = [s.name, s.status === 'done' ? 'סיים' : 'בעבודה', s.correct, s.total];
      FR.TOPICS.forEach(function (t) { var x = s.topics[t]; r.push(x.asked ? x.correct + '/' + x.asked : '', x.level || ''); });
      var top = Object.keys(s.mis).filter(function (m) { return !/_OTHER$/.test(m); }).sort(function (a, b) { return s.mis[b] - s.mis[a]; }).slice(0, 3).map(function (m) { return FR.MIS[m].name; });
      r.push(s.tier ? FR.TIER_LABEL[s.tier] : '', groupOf[s.id] || '', top.join('; '));
      rows.push(r);
    });
    rows.push([]);
    rows.push(['נושא', 'אחוז הצלחה', 'נכונות', 'שאלות', 'רמה ממוצעת']);
    FR.TOPICS.forEach(function (t) { var st = A.topicStats[t]; rows.push([FR.TOPIC_INFO[t].name, st.pct == null ? '' : st.pct + '%', st.correct, st.asked, st.avgLevel ? +st.avgLevel.toFixed(1) : '']); });
    rows.push([]);
    rows.push(['טעות נפוצה', 'נושא', 'תלמידים', 'פעמים', 'פעילות מומלצת', 'שאלת מעקב', 'שמות']);
    A.misList.forEach(function (m) { var i = FR.MIS[m.id]; if (!i) return; rows.push([i.name, FR.TOPIC_INFO[i.t].short, m.students.length, m.count, i.activity, FR.toPlain(i.follow), m.students.map(function (s) { return s.name; }).join(', ')]); });
    return rows;
  }

  /* =====================================================
     מקרן
     ===================================================== */
  var P = { poll: null, qrFor: '' };
  function projectorStart() {
    view.innerHTML = '<section class="proj"><div>' +
      '<h1>מסע השברים</h1>' +
      '<ol class="steps"><li>סורקים את הברקוד במצלמה של הטלפון</li><li>כותבים שם פרטי ואות ראשונה של שם המשפחה</li><li>עונים על 20 שאלות בקצב שלכם</li></ol>' +
      '<div class="pcount"><div><b id="p-j">0</b><span>הצטרפו</span></div><div><b id="p-d">0</b><span>סיימו</span></div></div>' +
      '<p id="p-st" style="margin-top:18px"></p>' +
      '</div><div class="qrbox"><div id="qr" role="img" aria-label="ברקוד לכניסה לבדיקה"></div><p class="purl" id="p-url"></p></div></section>';
    projectorTick();
    clearInterval(P.poll);
    P.poll = setInterval(function () { if (!document.hidden && MODE === 'projector') projectorTick(); }, 5000);
  }
  function projectorTick() {
    api('projectorStatus').then(function (r) {
      var j = document.getElementById('p-j'); if (!j) return;
      j.textContent = r.joined; document.getElementById('p-d').textContent = r.done;
      document.getElementById('p-st').innerHTML = '<span class="pill ' + (r.open ? 'open' : 'closed') + '">' + (r.open ? 'הבדיקה פתוחה' : 'הבדיקה סגורה') + '</span>';
      var url = r.url || '';
      document.getElementById('p-url').textContent = LIVE ? url : 'בהתקנה האמיתית הברקוד יוביל לקישור שלכם';
      if (P.qrFor !== url) {
        P.qrFor = url;
        var box = document.getElementById('qr'); box.innerHTML = '';
        if (typeof QRCode !== 'undefined') {
          try { new QRCode(box, { text: url, width: 512, height: 512, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch (e) { box.textContent = url; }
        } else box.textContent = url;
      }
    }, function () { /* ננסה שוב בסבב הבא */ });
  }

  start();
})();
</script>

</body>
</html>
